<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OIL FILM 検証</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #091113; color: #e8eee9; font: 14px/1.6 system-ui, sans-serif; }
  h1 { font-size: 16px; letter-spacing: .1em; margin: 0 0 4px; }
  p.note { color: #98aaa4; font-size: 12px; margin: 0 0 14px; }
  .r { padding: 8px 0; border-bottom: 1px solid rgba(214,228,222,.16); font-size: 13px; }
  .r b { font-family: ui-monospace, monospace; }
  .ok b { color: #9fd8a8; } .ng b { color: #f0907a; } .info b { color: #b9dcd6; }
  .r small { display: block; color: #98aaa4; }
  #sum { margin-top: 14px; font-weight: bold; }
</style>
</head>
<body>
<h1>OIL FILM 検証</h1>
<p class="note">同じフォルダの index.html から計算部分を読み込み、このブラウザで検証を実行します。数秒かかります。<br>
（パソコンでファイルを直接開くと読み込めないことがあります。その場合は公開ページか、Node の run-tests.js で実行してください）</p>
<div id="out">読み込み中…</div>
<div id="sum"></div>
<script>
(async function () {
  const out = document.getElementById('out'), sum = document.getElementById('sum');
  let html;
  try { html = await (await fetch('index.html', { cache: 'no-store' })).text(); }
  catch (e) { out.textContent = 'index.html を読み込めませんでした：' + e; return; }
  const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((m) => m[1]);
  const engine = blocks.find((b) => b.includes('OilContour = api'));
  const tests = blocks.find((b) => b.includes('runOilTests'));
  if (!engine || !tests) { out.textContent = '計算部分か検証が見つかりません'; return; }
  const root = {};
  new Function('self', engine)(root);
  new Function('self', tests)(root);
  document.querySelector('h1').textContent = 'OIL FILM 検証（エンジン v' + root.OilContour.ENGINE_VERSION + '）';
  out.textContent = '';
  let pass = 0, fail = 0;
  root.runOilTests((r) => {
    if (!r.info) { if (r.ok) pass++; else fail++; }
    const div = document.createElement('div');
    div.className = 'r ' + (r.info ? 'info' : r.ok ? 'ok' : 'ng');
    div.innerHTML = '<b>' + r.id + ' ' + (r.info ? '参考' : r.ok ? '合格' : '不合格') + '</b>　' + r.name + '<small>' + r.detail + '（' + r.sec.toFixed(2) + '秒）</small>';
    out.appendChild(div);
  }, () => { sum.textContent = 'まとめ：合格 ' + pass + '・不合格 ' + fail + '（画面 390×800 px）'; });
})();
</script>
</body>
</html>
